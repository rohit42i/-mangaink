name: MangaInker Web CI and GitHub Pages

on:
  push:
    branches: [web-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mangainker-pages-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run image processing tests
        run: npm test
      - name: Build Catalyst website
        run: npm run build
      - name: Prepare Catalyst web-client ZIP
        run: |
          node -e "const fs=require('fs');const p=require('./client-package.json');p.version='1.'+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync('dist/client-package.json',JSON.stringify(p,null,2)+'\\n')"
          cd dist
          zip -qr ../mangainker-catalyst-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: MangaInker-Catalyst-Web
          path: mangainker-catalyst-web.zip
          if-no-files-found: error

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build for GitHub Pages project path
        run: npm run build
        env:
          VITE_BASE_PATH: /-mangaink/
      - name: Add GitHub Pages marker
        run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
