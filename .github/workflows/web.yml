name: MangaInker Web CI
on:
  push:
    branches: [web-migration]
  pull_request:
    branches: [web-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
