name: MangaInker Web CI
on:
  push:
    branches: [web-migration]
  pull_request:
    branches: [web-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Prepare Catalyst web-client ZIP
        run: |
          node -e "const fs=require('fs');const p=require('./client-package.json');p.version='1.'+process.env.GITHUB_RUN_NUMBER;fs.writeFileSync('dist/client-package.json',JSON.stringify(p,null,2)+'\\n')"
          cd dist
          zip -qr ../mangainker-catalyst-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: MangaInker-Catalyst-Web
          path: mangainker-catalyst-web.zip
          if-no-files-found: error
