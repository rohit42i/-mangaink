name: Manga Inker Android CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manga-inker-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      signed_release: ${{ steps.signing.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare protected release signing
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.MANGA_INKER_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.MANGA_INKER_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MANGA_INKER_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MANGA_INKER_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${KEYSTORE_BASE64}" && -n "${STORE_PASSWORD}" && -n "${KEY_ALIAS}" && -n "${KEY_PASSWORD}" ]]; then
            mkdir -p .ci
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > .ci/manga-inker-release.jks
            test -s .ci/manga-inker-release.jks
            echo "MANGA_INKER_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/.ci/manga-inker-release.jks" >> "$GITHUB_ENV"
            echo "MANGA_INKER_RELEASE_STORE_PASSWORD=${STORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "MANGA_INKER_RELEASE_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "MANGA_INKER_RELEASE_KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Protected release signing is configured."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured; release output will be unsigned."
          fi

      - name: Set build version
        shell: bash
        run: |
          echo "VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.1.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle --no-daemon "-PVERSION_CODE=$VERSION_CODE" "-PVERSION_NAME=$VERSION_NAME" clean :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle --no-daemon "-PVERSION_CODE=$VERSION_CODE" "-PVERSION_NAME=$VERSION_NAME" :app:lintDebug

      - name: Build signed release APK
        run: gradle --no-daemon "-PVERSION_CODE=$VERSION_CODE" "-PVERSION_NAME=$VERSION_NAME" :app:assembleRelease

      - name: Verify merged manifest permissions
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(find app/build/intermediates -type f -name AndroidManifest.xml | grep -E 'merged_manifest.*/release|merged_manifests.*/release' | head -n 1 || true)"
          if [[ -z "$manifest" ]]; then
            echo "Could not locate the merged release manifest."
            find app/build/intermediates -type f -name AndroidManifest.xml
            exit 1
          fi
          echo "Checking $manifest"
          if grep -E 'android.permission.(READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|MANAGE_EXTERNAL_STORAGE)' "$manifest"; then
            echo "A prohibited broad-storage permission was merged into the app manifest."
            exit 1
          fi
          grep -q 'android.permission.INTERNET' "$manifest"
          grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' "$manifest"
          grep -q 'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION' "$manifest"
          grep -q 'android:foregroundServiceType="mediaProjection"' "$manifest"
          grep -q 'com.example.mangainker.capture.ScreenCaptureService' "$manifest"
          echo "Verified: screen capture uses explicit MediaProjection consent and a typed foreground service; no broad-storage permission."

      - name: Upload debug APK for physical-device testing
        uses: actions/upload-artifact@v4
        with:
          name: manga-inker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: manga-inker-install-once-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manga-inker-verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

  publish-private-update:
    needs: verify-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify-and-build.outputs.signed_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified signed APK
        uses: actions/download-artifact@v4
        with:
          name: manga-inker-install-once-release-apk
          path: release

      - name: Create SHA-256 update manifest
        shell: bash
        run: |
          set -euo pipefail
          apk="release/app-release.apk"
          test -s "$apk"
          sha="$(sha256sum "$apk" | cut -d ' ' -f 1)"
          cat > release/update.json <<EOF
          {
            "packageName": "com.rohit.mangainker",
            "versionCode": $((1000 + GITHUB_RUN_NUMBER)),
            "versionName": "1.1.$GITHUB_RUN_NUMBER",
            "sha256": "$sha",
            "commit": "$GITHUB_SHA"
          }
          EOF
          cat release/update.json

      - name: Publish latest private GitHub update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete mobile-latest --cleanup-tag --yes || true
          gh release create mobile-latest \
            release/app-release.apk \
            release/update.json \
            --title "Manga Inker latest" \
            --notes "Automatic update build 1.1.$GITHUB_RUN_NUMBER. Commit: $GITHUB_SHA" \
            --target "$GITHUB_SHA" \
            --prerelease
