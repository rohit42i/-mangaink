name: Manga Inker Android Inking App

on:
  push:
    branches: [web-migration]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manga-inker-android-web-branch
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Manga Inker source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run tests, lint, and build the actual Android app
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload system-wide inking APK
        uses: actions/upload-artifact@v4
        with:
          name: MangaInker-Systemwide-Inking-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MangaInker-Android-Verification
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 30
