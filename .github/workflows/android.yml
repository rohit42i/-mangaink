name: Manga Inker Android CI

on:
  push:
    branches: [ main, 'feature/manga-studio-0.4', 'feature/manga-inker-permission-ux' ]
  workflow_dispatch:

concurrency:
  group: manga-inker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Expand one-time source bootstrap
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "bootstrap/parts" ]]; then
            cat bootstrap/parts/*.b64 > "$RUNNER_TEMP/mangaink-source.tar.xz.b64"
            base64 --decode "$RUNNER_TEMP/mangaink-source.tar.xz.b64" > "$RUNNER_TEMP/mangaink-source.tar.xz"
            tar -tJf "$RUNNER_TEMP/mangaink-source.tar.xz" >/dev/null
            tar -xJf "$RUNNER_TEMP/mangaink-source.tar.xz" -C "$RUNNER_TEMP"
            cp -a "$RUNNER_TEMP/MangaInker/." .
            rm -rf bootstrap "$RUNNER_TEMP/MangaInker"
            # The Actions token cannot commit workflow-file changes without the separate workflows scope.
            git add -A -- ':!.github/workflows/android.yml'
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Expand Manga Inker Android source"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests, lint, and build
        run: gradle --no-daemon clean :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: manga-inker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manga-inker-verification-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14
